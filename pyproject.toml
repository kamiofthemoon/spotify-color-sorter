[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pylint.main]
py-version = "3.11"
init-hook = "import sys; sys.path.insert(0, '.')"

[tool.pylint.format]
max-line-length = 88  # same as black

[tool.pylint."messages control"]
disable = ["missing-module-docstring"]

[tool.pylint.basic]
no-docstring-rgx = "^(_|test_)"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
